name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Test, build and lint
        run: |
          set -o pipefail
          ./gradlew :core:api:test :terminal:emulator:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace 2>&1 | tee build.log

      # Repeats failures as annotations, which are readable through the API.
      - name: Report results
        if: always()
        run: python3 .github/scripts/report_results.py build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            core/api/build/reports/
            terminal/emulator/build/reports/
          if-no-files-found: ignore
